<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Retrovibes &ndash; Figuren, sechs Fassungen</title>
<!--
  Vergleichsblatt fuer den Figurendruck. Benutzt die echten Sprites,
  die echten Weltpaletten und dieselbe Presse wie die App - was hier
  steht, sieht in der App genauso aus.

  Aufrufen unter http://localhost:8124/tools/figuren-varianten.html
-->
<style>
  @font-face {
    font-family: "Oswald";
    src: url("../assets/fonts/oswald-latein.ttf") format("truetype-variations"),
         url("../assets/fonts/oswald-latein.ttf") format("truetype");
    font-weight: 200 700;
  }
  body {
    margin: 0; padding: 16px 14px 22px;
    background: #3c2e49; color: #f6ecd6;
    font: 15px/1.5 system-ui, sans-serif;
  }
  h1 { margin: 0 0 4px; font: 700 24px/1 "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .02em; }
  .lede { margin: 0 0 16px; color: #d9c9d5; max-width: 62em; }
  /* Raster statt Liste: nur nebeneinander kann man Fassungen wirklich
     vergleichen, untereinander vergisst man die obere. */
  #blatt { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .fassung { padding: 12px 14px 10px; background: #f6ecd6; border-radius: 10px; }
  .kopf { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
  .nr {
    display: inline-grid; place-items: center; width: 24px; height: 24px;
    background: #914e72; color: #f6ecd6; border-radius: 50%;
    font: 700 14px/1 "Oswald", sans-serif;
  }
  h2 { margin: 0; color: #2b2540; font: 700 17px/1 "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .02em; }
  .wie { margin: 0 0 6px; min-height: 2.6em; color: #6d657a; font-size: 12.5px; line-height: 1.3; }
  .reihe { display: flex; align-items: flex-end; gap: 10px; }
  .reihe canvas { display: block; image-rendering: auto; }
  .welt { margin: 10px 0 0; color: #6d657a; font: 600 12px/1 "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body>
<h1>Figuren &ndash; sechs Fassungen</h1>
<p class="lede">Dieselben drei Cyberpunk-Figuren, sechsmal unterschiedlich gedruckt.
Fassung&nbsp;1 ist der jetzige Stand. Nach unten wird es einfacher.</p>
<div id="blatt"></div>

<script src="../js/riso.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/genres.js"></script>
<script src="../js/pixel-art.js"></script>
<script>
'use strict';

/* Die Palette einer Welt ohne die gerechneten Zwischentoene: jede
   Aufhellung und jeder Schatten faellt auf seine Grundfarbe zurueck.
   Aus zwoelf Farben werden damit sechs. */
function flachePalette(g){
  const p = g.pal;
  return Object.assign({}, p, {a: p.A, H: p.A, b: p.B, c: p.C, s: p.S});
}

function risoFarben(g){ return g.riso || [g.ac, g.ac2]; }

/* Wie paintGenreCard und risoSprite in der App, nur mit frei
   waehlbaren Einstellungen. */
function drucke(g, spriteName, sc, o){
  const merker = g._pal;
  if(o.flachePalette) g._pal = flachePalette(g);
  const src = spriteCanvas(spriteName, g, sc);
  g._pal = merker;

  const rand = Math.max(2, Math.round(sc*0.8));
  const W = src.width + rand*2, H = src.height + rand*2;
  const pr = RISO.press(W, H, {inks: risoFarben(g), paper: RISO.PAPER});
  pr.maske(src, rand, rand, 3, 1);
  pr.stamp(src, rand, rand, 'set', o.stufen);
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  pr.render(cv.getContext('2d'), {
    pitch: o.pitch || sc, shift: o.shift, grain: o.grain,
    density: 0.95, transparent: true, flach: o.flach,
    angles: [0, Math.PI/2]
  });
  return cv;
}

const FASSUNGEN = [
  {
    titel: 'Jetzt',
    wie: 'Zwei Tonwertstufen, Raster auf dem Pixelgitter, wenig Korn und Versatz.',
    o: {stufen: 2, shift: 0.6, grain: 0.03}
  },
  {
    titel: 'Ganz flach',
    wie: 'Kein Raster, eine Tonwertstufe: nur die vier Volltoene, die zwei Farben auf Papier ergeben.',
    o: {stufen: 1, shift: 0.6, grain: 0, flach: true}
  },
  {
    titel: 'Flache Palette, flach gedruckt',
    wie: 'Zusaetzlich fallen alle gerechneten Schatten und Lichter auf ihre Grundfarbe zurueck.',
    o: {stufen: 1, shift: 0.6, grain: 0, flach: true, flachePalette: true}
  },
  {
    titel: 'Flach, ohne Passerversatz',
    wie: 'Wie 3, aber die beiden Farben sitzen genau uebereinander. Am saubersten.',
    o: {stufen: 1, shift: 0, grain: 0, flach: true, flachePalette: true}
  },
  {
    titel: 'Grobes Raster',
    wie: 'Volle Palette, aber ein Punkt auf je zwei Figurenpixel statt auf jedem.',
    o: {stufen: 2, shift: 0.6, grain: 0.03, grob: 2}
  },
  {
    titel: 'Flach mit deutlichem Versatz',
    wie: 'Volltoene, flache Palette, dafuer sitzt die zweite Farbe klar daneben.',
    o: {stufen: 1, shift: 1.6, grain: 0, flach: true, flachePalette: true}
  }
];

const ZEIGEN = [
  {welt: 'cyber', figuren: ['stomper', 'klatscher', 'saenger']}
];

const SC = 6;   /* gross genug, dass man das Raster wirklich sieht */
const blatt = document.getElementById('blatt');

FASSUNGEN.forEach(function(f, i){
  const box = document.createElement('div');
  box.className = 'fassung';
  box.innerHTML = '<div class="kopf"><span class="nr">' + (i+1) + '</span>' +
                  '<h2>' + f.titel + '</h2></div>' +
                  '<p class="wie">' + f.wie + '</p>';
  ZEIGEN.forEach(function(z){
    const g = GENRES.find(function(x){ return x.id === z.welt; });
    const reihe = document.createElement('div');
    reihe.className = 'reihe';
    z.figuren.forEach(function(name){
      if(!SPRITES[name]) return;
      const o = Object.assign({}, f.o);
      if(o.grob) o.pitch = SC * o.grob;
      reihe.appendChild(drucke(g, name, SC, o));
    });
    const gruppe = document.createElement('div');
    gruppe.appendChild(reihe);
    box.appendChild(gruppe);
  });
  blatt.appendChild(box);
});
</script>
</body>
</html>
